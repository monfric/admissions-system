<div class="row align-items-center mt-2" *ngIf="totalItems > 0">
  <div class="col-md-6">
    <p class="text-muted small mb-2 mb-md-0">
      Showing {{ rangeStart }} to {{ rangeEnd }} of {{ totalItems }} entries
    </p>
  </div>
  <div class="col-md-6">
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-sm justify-content-md-end mb-0">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="goTo(currentPage - 1)" href="javascript:void(0)">
            <i class="fas fa-angle-left"></i>
          </a>
        </li>

        <li class="page-item" *ngFor="let page of getPageNumbers()" [class.active]="page === currentPage">
          <a class="page-link" (click)="goTo(page)" href="javascript:void(0)">{{ page }}</a>
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="goTo(currentPage + 1)" href="javascript:void(0)">
            <i class="fas fa-angle-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>

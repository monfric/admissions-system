<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMTC:: Staff Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <!-- <i class="fas fa-user"></i> -->
                    <img src="assets/dist/img/logo.png" style="height:80px;">
                </div>
              
                <h2 style="color: #003361;">NMTC Staff Portal</h2>
                <!-- <p class="text-muted">Enter Email and Password</p> -->
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="input-group mb-3">
                <input type="email" 
                formControlName="email" 
                placeholder="Enter Email"
                id="email" 
                class="form-control"
                required>
                <div class="input-group-append">
                  <div class="input-group-text">
                    <span class="fas fa-envelope"></span>
                  </div>
                </div>
              </div>
                <div *ngIf="email?.invalid && email?.touched" class="error">
                  Valid email is required
                </div>

                <div class="input-group mb-3">
                  <input [type]="showPassword ? 'text' : 'password'" 
                  formControlName="password" 
                  placeholder="Enter Password"
                  class="form-control"
                  id="password" 
                  required>
                  <div class="input-group-append">
                    <button type="button"
                            class="input-group-text password-toggle"
                            (click)="showPassword = !showPassword"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                            [attr.aria-pressed]="showPassword"
                            [title]="showPassword ? 'Hide password' : 'Show password'">
                      <span class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></span>
                    </button>
                  </div>
                </div>
                <div *ngIf="password?.invalid && password?.touched" class="error">
                  Password is required
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a routerLink="/forgot-password" class="small">Forgot password?</a>
                </div>

                <div *ngIf="errorMessage" class="alert alert-danger py-2 small mb-3">
                    <i class="fas fa-exclamation-circle mr-1"></i>{{ errorMessage }}
                </div>

                <button *ngIf="isLoading ==false" type="submit" [disabled]="loginForm.invalid" class="btn btn-login btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
                <div class="loading-part">
                <span *ngIf="isLoading == true">
                  <div class="spinner-grow text-success"></div>
                  <div class="spinner-grow text-secondary"></div>
                  <div class="spinner-grow text-warning"></div>
                </span>
                </div>
            </form>


            <br>
        <h6 style="width: 100%;text-align: center;">Copyright &copy; 2026 <a style="color: #b3021c;" href="https://nmtc.ac.ke" target="_blank">NMTC</a>. All rights reserved.</h6>
        </div>
        
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>

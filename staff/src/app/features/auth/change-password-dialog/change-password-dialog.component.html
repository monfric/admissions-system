<div class="dialog-shell" [formGroup]="form">

  <!-- ===== HEADER ===== -->
  <div class="dialog-header">
    <div class="dialog-header-left">
      <div class="dialog-header-icon">
        <i class="fas fa-key"></i>
      </div>
      <div>
        <h2 class="dialog-title">Change Password</h2>
        <p class="dialog-subtitle">Your staff account</p>
      </div>
    </div>
    <button class="btn-close-dialog" type="button" (click)="cancel()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- ===== BODY ===== -->
  <div class="dialog-body">
    <div class="form-group">
      <label class="form-label req">Current Password</label>
      <input type="password" class="form-control" formControlName="old_password" autocomplete="current-password"
             [class.is-invalid]="fieldError('old_password')">
      <div class="invalid-feedback" *ngIf="fieldError('old_password')">{{ fieldError('old_password') }}</div>
    </div>
    <div class="form-group">
      <label class="form-label req">New Password</label>
      <input type="password" class="form-control" formControlName="new_password" autocomplete="new-password"
             [class.is-invalid]="fieldError('new_password')">
      <div class="invalid-feedback" *ngIf="fieldError('new_password')">{{ fieldError('new_password') }}</div>
    </div>
    <div class="form-group">
      <label class="form-label req">Confirm New Password</label>
      <input type="password" class="form-control" formControlName="confirm_password" autocomplete="new-password"
             [class.is-invalid]="fieldError('confirm_password')">
      <div class="invalid-feedback" *ngIf="fieldError('confirm_password')">{{ fieldError('confirm_password') }}</div>
    </div>
  </div>

  <!-- ===== ERROR BANNER ===== -->
  <div class="error-banner" *ngIf="errorMessage">
    <i class="fas fa-exclamation-circle mr-2"></i>
    <span>{{ errorMessage }}</span>
    <button class="error-dismiss" type="button" (click)="errorMessage = ''">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="dialog-footer">
    <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    <button type="button" class="btn-save" (click)="save()" [disabled]="submitting">
      <span *ngIf="!submitting"><i class="fas fa-check mr-1"></i>Change Password</span>
      <span *ngIf="submitting"><i class="fas fa-spinner fa-spin mr-1"></i>Saving&hellip;</span>
    </button>
  </div>

</div>

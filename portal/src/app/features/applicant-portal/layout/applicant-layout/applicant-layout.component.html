<!-- Sidebar -->
<aside class="main-sidebar sidebar-dark-primary elevation-4">

  <a routerLink="/applicant/dashboard" class="brand-link">
    <img src="assets/dist/img/logo.png"
         alt="NMTC"
         class="brand-image img-circle elevation-3"
         style="opacity:.8">
    <span class="brand-text font-weight-light">Applicant Portal</span>
  </a>

  <div class="sidebar">

    <div class="user-panel mt-3 pb-3 mb-3 d-flex align-items-center">
      <div class="image mr-2">
        <div class="app-sb-avatar">{{ nameInitial }}</div>
      </div>
      <div class="info">
        <span class="d-block text-white" style="font-size:.9rem; font-weight:600;">{{ firstName }}</span>
        <small class="text-white-50">Applicant</small>
      </div>
    </div>

    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
        <li class="nav-item" *ngIf="profileComplete">
          <a routerLink="/applicant/dashboard" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-tachometer-alt"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li class="nav-item" *ngIf="profileComplete">
          <a routerLink="/applicant/apply" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-file-signature"></i>
            <p>Apply for a Course</p>
          </a>
        </li>
        <li class="nav-item" *ngIf="profileComplete">
          <a routerLink="/applicant/applications" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-list-alt"></i>
            <p>My Applications</p>
          </a>
        </li>
        <li class="nav-item" *ngIf="profileComplete">
          <a routerLink="/applicant/payments" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-receipt"></i>
            <p>Payments</p>
          </a>
        </li>
        <li class="nav-item" *ngIf="profileComplete">
          <a routerLink="/applicant/profile" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-id-card"></i>
            <p>My Profile</p>
          </a>
        </li>
        <li class="nav-item" *ngIf="!profileComplete">
          <a routerLink="/applicant/profile-setup" routerLinkActive="active" class="nav-link">
            <i class="nav-icon fas fa-user-edit"></i>
            <p>Complete Profile</p>
          </a>
        </li>
        <li class="nav-item">
          <a href="javascript:void(0)" class="nav-link" (click)="logout()">
            <i class="nav-icon fas fa-sign-out-alt"></i>
            <p>Logout</p>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</aside>

<!-- Navbar -->
<nav class="main-header navbar navbar-expand navbar-white navbar-light">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" role="button" style="color: #257ffe"><i class="fas fa-bars"></i></a>
    </li>
    <li class="nav-item d-none d-sm-inline-block">
      <a class="nav-link" style="color: #af1379"><b>NMTC Applicant Portal</b></a>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto">
    <li class="nav-item">
      <a class="nav-link" href="javascript:void(0)" (click)="logout()" title="Logout">
        <i class="fas fa-sign-out-alt mr-1"></i> Logout
      </a>
    </li>
  </ul>
</nav>

<router-outlet></router-outlet>

<app-footer></app-footer>

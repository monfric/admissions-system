<div class="tab-pane">
  <div class="notice-banner">
    <i class="fas fa-info-circle mt-1"></i>
    <span>
      Please review your details before submitting. <b>After you submit, your details are locked</b> &mdash;
      you'll only be able to replace your documents.
    </span>
  </div>

  <ng-container *ngFor="let section of sections">
    <div class="form-section-title d-flex justify-content-between align-items-center">
      <span><i class="fas mr-2 text-primary" [ngClass]="section.icon"></i>{{ section.label }}</span>
      <button type="button" class="btn-view-file" (click)="editStep.emit(section.index)">
        <i class="fas fa-pen mr-1"></i>Edit
      </button>
    </div>
    <div class="review-grid">
      <div class="review-item" *ngFor="let field of visibleFields(section.fields)">
        <div class="review-label">{{ label(field) }}</div>
        <div class="review-value" *ngIf="!isMissing(field)">{{ value(field) || '—' }}</div>
        <div class="review-missing" *ngIf="isMissing(field)">Required</div>
      </div>
    </div>
  </ng-container>

  <div class="form-section-title d-flex justify-content-between align-items-center">
    <span><i class="fas fa-file-alt mr-2 text-primary"></i>Required Documents</span>
    <button type="button" class="btn-view-file" (click)="editStep.emit(documentsStepIndex)">
      <i class="fas fa-pen mr-1"></i>Edit
    </button>
  </div>
  <div class="doc-check" *ngFor="let doc of requiredDocuments">
    <i class="fas" [ngClass]="hasDocument(doc.type) ? 'fa-check-circle' : 'fa-times-circle'"></i>
    <span>{{ doc.label }}</span>
    <span class="text-danger small" *ngIf="!hasDocument(doc.type)">&mdash; not uploaded</span>
  </div>
</div>
